<style>
:root{
  --paper:#ffffff; --ink:#000000; --soft:#5c5c5c;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --ui:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* The course is paper-and-ink by design, so it stays white in either viewer theme. */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#ffffff; --ink:#000000; --soft:#5c5c5c; } }
:root[data-theme="dark"]{ --paper:#ffffff; --ink:#000000; --soft:#5c5c5c; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:var(--ui)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

#top{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 6px;
  display:grid;grid-template-columns:1fr auto;align-items:start;gap:8px}
.hn{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;letter-spacing:-.01em}
.hn,.sub,#shot{text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 6px #fff}
.sub{font-size:13px;font-weight:700;color:var(--soft);margin-top:4px;line-height:1.25}
.sub b{color:var(--ink)}
.right{display:flex;gap:12px;align-items:flex-start}
.pts{text-align:right;min-width:64px}
.pv{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 3px #fff,0 0 6px #fff;display:inline-block;transform-origin:100% 80%}
.pv.bump{animation:bump .4s ease-out}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.3,.78)}55%{transform:scale(.9,1.14)}78%{transform:scale(1.04,.97)}100%{transform:scale(1)}}
#streak.hot{color:var(--ink)}
.brk{display:flex;justify-content:center;align-items:baseline;gap:10px;flex-wrap:wrap;border:1.5px dashed var(--ink);border-radius:14px;padding:10px 12px;margin:0 0 16px;font-weight:700}
.brk b{font-family:var(--display);font-size:24px;font-weight:900}
.big{font-family:var(--display);font-weight:900;font-size:44px;line-height:1;margin:4px 0 2px}
.sc .pp{font-size:10.5px}
.wind{display:flex;flex-direction:column;align-items:center;min-width:52px}
.wind svg{width:42px;height:42px;overflow:visible}
#warrow{transition:transform .6s cubic-bezier(.34,1.56,.64,1)}

#bar{position:fixed;left:0;right:0;bottom:0;z-index:5;
  padding:6px 10px calc(env(safe-area-inset-bottom,0px) + 12px);background:linear-gradient(to top,#fff 70%,rgba(255,255,255,0))}
#shot{text-align:center;font-size:14px;font-weight:700;margin:0 0 8px;min-height:18px}
#shot span{color:var(--soft);font-weight:600}
#clubs{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;max-width:520px;margin:0 auto}
.club{appearance:none;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:12px;
  padding:7px 0 6px;font-family:var(--display);font-weight:800;font-size:16px;line-height:1;cursor:pointer;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .12s,color .12s}
.club small{display:block;font-family:var(--ui);font-size:10px;font-weight:700;margin-top:4px;opacity:.75}
.club.on{background:var(--ink);color:var(--paper);transform:translateY(-5px)}
.club.pop{animation:pop .42s ease-out}
.club:active{transform:scale(1.06,.9)}
.club:disabled{opacity:.35}
.club.lock{border-style:dashed;opacity:.35}
.club.lock small{font-size:9px}
.club.off{opacity:.3;text-decoration:line-through}
.club.nope{animation:nope .3s}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.tw{display:inline-block;vertical-align:middle;font-family:var(--ui);font-style:normal;font-size:12px;font-weight:800;letter-spacing:0;background:var(--ink);color:var(--paper);border-radius:999px;padding:4px 9px;margin-left:4px;text-shadow:none;transform:translateY(-3px)}
.panel h3{font-family:var(--display);font-weight:800;font-size:20px;margin:0 0 10px;text-align:left}
.picks{display:grid;gap:8px;margin-bottom:16px}
.pick{appearance:none;display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;border:2px solid var(--ink);border-radius:14px;padding:10px 14px;
  background:var(--paper);color:var(--ink);cursor:pointer;font-family:var(--ui);animation:pickIn .5s cubic-bezier(.3,.7,.3,1) both;transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .15s}
.pick i{grid-column:1;font-style:normal;font-size:11px;font-weight:700;color:var(--soft)}
.pick b{grid-column:1;font-family:var(--display);font-style:italic;font-weight:900;font-size:20px;line-height:1.1}
.pick span{grid-column:1;font-size:13px;font-weight:600;line-height:1.35}
.pick em{grid-column:2;grid-row:1/4;align-self:center;font-style:normal;font-family:var(--display);font-weight:900;font-size:24px}
.pick:hover{box-shadow:3px 4px 0 var(--ink)}
.pick:active{transform:scale(1.03,.94)}
.pick:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.pick.chosen{background:var(--ink);color:var(--paper);animation:chosen .35s ease-out}
.pick.chosen i{color:var(--paper)}
@keyframes pickIn{0%{opacity:0;transform:translateY(24px) scale(.9,1.12)}60%{opacity:1;transform:translateY(-3px) scale(1.03,.97)}100%{opacity:1;transform:none}}
@keyframes chosen{0%{transform:scale(1)}40%{transform:scale(1.06,.9)}100%{transform:scale(1)}}
.logo{font-size:44px !important;margin-bottom:4px !important}
.evn{font-size:12px !important;font-weight:800 !important;color:var(--ink) !important;margin:0 0 4px !important}
.events{display:grid;gap:10px;margin:14px 0 8px}
.event{appearance:none;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;border:2.5px solid var(--ink);border-radius:18px;padding:12px 14px;
  background:var(--paper);color:var(--ink);cursor:pointer;font-family:var(--ui);box-shadow:4px 5px 0 var(--ink);animation:pickIn .55s cubic-bezier(.3,.7,.3,1) both;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.event:active{transform:scale(1.03,.94)}
.event:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.event.locked{border-style:dashed;box-shadow:none;opacity:.55;cursor:default}
.event.nope{animation:nope .3s}
.tw-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:56px}
.tw-wrap small{font-size:10.5px;font-weight:800}
.ev{display:grid;gap:3px}
.ev b{font-family:var(--display);font-style:italic;font-weight:900;font-size:21px;line-height:1.05}
.ev i{font-style:normal;font-size:12px;font-weight:700;color:var(--soft);letter-spacing:.02em}
.ev span{font-size:13px;font-weight:600;line-height:1.35}
.bestp{font-size:11.5px;font-weight:700;color:var(--soft)}
.cab{font-size:13px !important;font-weight:800 !important;color:var(--ink) !important}
.board{border:2px solid var(--ink);border-radius:14px;overflow:hidden;margin:0 0 16px;text-align:left}
.board .row{display:grid;grid-template-columns:28px 1fr auto 44px;align-items:center;gap:6px;padding:7px 12px;border-top:1.5px solid var(--ink);animation:rowIn .45s cubic-bezier(.3,.7,.3,1) both}
.board .row:first-child{border-top:0}
.board .row.fr .nm{text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.board .row.fr .pos{font-style:italic}
.board .row.me{background:var(--ink);color:var(--paper)}
.board .pos{font-family:var(--display);font-weight:900;font-size:17px}
.board .nm{font-weight:800;font-size:14px;line-height:1.15}
.board .nm small{display:block;font-weight:600;font-size:11px;opacity:.7}
.board b{font-family:var(--display);font-weight:900;font-size:19px;text-align:right}
.board i{font-style:normal;font-size:11px}
@keyframes rowIn{0%{opacity:0;transform:translateX(-18px)}70%{opacity:1;transform:translateX(3px)}100%{opacity:1;transform:none}}
.award{display:grid;place-items:center;margin:4px 0 8px}
.award .troph{animation:trophyIn 1s cubic-bezier(.3,.7,.3,1) both .2s;transform-origin:50% 100%}
.award p{margin:6px 0 0 !important;font-family:var(--display);font-style:italic;font-weight:900;font-size:22px;color:var(--ink) !important}
@keyframes trophyIn{0%{opacity:0;transform:translateY(-120px) scale(.7,1.3)}45%{opacity:1;transform:translateY(0) scale(1.25,.72)}62%{transform:translateY(-14px) scale(.9,1.12)}78%{transform:translateY(0) scale(1.06,.95)}100%{transform:none}}
.unlock{border:2px solid var(--ink);border-radius:999px;padding:6px 12px;display:inline-block;color:var(--ink) !important;font-weight:800 !important}
.pick.curse{border-style:dashed;border-width:2.5px}
.btn.ghost{background:var(--paper);color:var(--ink);margin-top:8px}
.shopbtn{appearance:none;display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2.5px solid var(--ink);border-radius:16px;padding:10px 14px;margin:4px 0 6px;
  background:var(--ink);color:var(--paper);cursor:pointer;font-family:var(--ui);box-shadow:4px 5px 0 var(--ink);transition:transform .2s cubic-bezier(.34,1.56,.64,1);animation:pickIn .5s cubic-bezier(.3,.7,.3,1) both .45s}
.shopbtn .bag{background:#fff;border-radius:10px;padding:3px 6px;display:grid;place-items:center}
.shopbtn b{display:block;font-family:var(--display);font-style:italic;font-weight:900;font-size:21px}
.shopbtn small{font-size:12.5px;font-weight:700;opacity:.85}
.shopbtn:active{transform:scale(1.03,.93)}
.shopbtn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.wallet{display:flex;justify-content:space-between;align-items:baseline;border:2px solid var(--ink);border-radius:14px;padding:8px 14px;margin:0 0 12px}
.wallet small{font-size:12px;font-weight:800}
.wallet b{font-family:var(--display);font-weight:900;font-size:26px;font-variant-numeric:tabular-nums}
.shop{display:grid;gap:8px;margin-bottom:10px;text-align:left}
.srow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;border:2px solid var(--ink);border-radius:14px;padding:9px 10px;animation:rowIn .45s cubic-bezier(.3,.7,.3,1) both}
.srow.locked{border-style:dashed;opacity:.5}
.srow.flash{animation:bought .55s cubic-bezier(.3,.7,.3,1)}
@keyframes bought{0%{transform:scale(1)}30%{transform:scale(1.05,.9);background:var(--ink);color:var(--paper)}60%{transform:scale(.98,1.04)}100%{transform:none}}
.sid{font-family:var(--display);font-weight:900;font-size:20px;text-align:center;border:2px solid var(--ink);border-radius:10px;padding:6px 0}
.sinfo b{display:block;font-weight:800;font-size:14px}
.sinfo small{display:block;font-size:11.5px;font-weight:600;color:var(--soft);line-height:1.3;margin-top:2px}
.slv{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;margin-top:2px}
.pips{display:inline-flex;gap:3px}
.pips i{width:9px;height:9px;border:1.5px solid var(--ink);border-radius:50%;display:block}
.pips i.on{background:var(--ink)}
.srow.flash .pips i.on:last-of-type{animation:pipPop .5s cubic-bezier(.34,1.56,.64,1) .1s both}
@keyframes pipPop{0%{transform:scale(0)}60%{transform:scale(1.6)}100%{transform:scale(1)}}
.sbuy{appearance:none;border:2px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:12px;padding:6px 10px;font-family:var(--display);font-weight:900;font-size:16px;cursor:pointer;
  line-height:1.05;text-align:center;min-width:74px;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.sbuy small{display:block;font-family:var(--ui);font-size:10px;font-weight:700;opacity:.8}
.sbuy[aria-disabled="true"]{background:var(--paper);color:var(--ink);opacity:.45}
.sbuy:active{transform:scale(1.08,.88)}
.sbuy.nope{animation:nope .3s}
.sbuy:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.smax,.slock{font-size:12px;font-weight:800;padding:0 6px}
.nxt{color:var(--ink);font-weight:700}
.perk{font-size:12.5px !important;font-weight:700 !important;color:var(--ink) !important;min-height:1.3em}
.wal{font-weight:800 !important;color:var(--ink) !important}
.nameform{display:grid;gap:8px;text-align:left;margin-top:6px}
.nameform label{font-size:12px;font-weight:800}
#nameIn{font:800 22px var(--display);font-style:italic;border:2.5px solid var(--ink);border-radius:14px;padding:12px 14px;background:var(--paper);color:var(--ink);width:100%;-webkit-user-select:text;user-select:text}
#nameIn:focus{outline:3px solid var(--ink);outline-offset:2px}
#nameIn.nope{animation:nope .3s}
.grpin{font:700 16px var(--ui);border:2px solid var(--ink);border-radius:12px;padding:10px 12px;background:var(--paper);color:var(--ink);width:100%;-webkit-user-select:text;user-select:text}
.grpin:focus{outline:3px solid var(--ink);outline-offset:2px}
.nhelp{font-size:11.5px;font-weight:600;color:var(--soft);line-height:1.35;margin-top:-2px}
.netline{font-size:12px !important;font-weight:700 !important;color:var(--ink) !important;margin:6px 0 0 !important;line-height:1.35}
.netline.bad{border:1.5px dashed var(--ink);border-radius:10px;padding:6px 8px}
.nerr{min-height:1.1em;margin:0 !important;font-size:12.5px !important;font-weight:700 !important;color:var(--ink) !important}
.asname{margin:-4px 0 10px !important;font-size:13px !important}
.asname b{color:var(--ink)}
.linkbtn{appearance:none;border:0;background:none;padding:2px 4px;font:inherit;font-weight:800;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.linkbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.how{text-align:left;font-size:13px;font-weight:600;border:1.5px dashed var(--ink);border-radius:12px;padding:10px 12px;margin:0 0 16px;line-height:1.45}
.kit{font-size:12.5px;font-weight:600;text-align:left;margin:0 0 14px !important;color:var(--ink) !important;line-height:1.5}
.club:focus-visible,.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@keyframes pop{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-8px) scale(.86,1.2)}60%{transform:translateY(-3px) scale(1.1,.92)}100%{transform:translateY(-5px) scale(1)}}

#strikeWrap{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 152px);z-index:7}
#strike{width:54px;height:54px;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper);color:var(--ink);box-shadow:3px 4px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;
  transition:transform .28s cubic-bezier(.34,1.56,.64,1),opacity .2s,background .12s,color .12s}
#strike svg{width:36px;height:36px}
#strike.on{background:var(--ink);color:var(--paper)}
#strike:active{transform:scale(1.12,.86)}
#strike:disabled{opacity:.3;cursor:default}
#strike:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
#dial{position:absolute;left:0;bottom:66px;width:196px;background:var(--paper);border:2.5px solid var(--ink);border-radius:22px;box-shadow:5px 6px 0 var(--ink);padding:10px 10px 12px;text-align:center;
  transform-origin:24px 100%;animation:dialIn .42s cubic-bezier(.3,.7,.3,1)}
#dial[hidden]{display:none}
#dialSvg:focus{outline:none}
#dialSvg:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:50%}
#dialSvg{width:150px;height:150px;touch-action:none;cursor:ns-resize;display:block;margin:2px auto}
.dlab{font-size:12px;font-weight:800;line-height:1.15}
.dlab small{font-weight:600;color:var(--soft)}
.dname{margin-top:6px;font-family:var(--display);font-style:italic;font-weight:900;font-size:20px}
@keyframes dialIn{0%{opacity:0;transform:scale(.3,.5)}55%{opacity:1;transform:scale(1.06,.94)}78%{transform:scale(.98,1.02)}100%{transform:none}}
#scope{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 152px);z-index:6;width:54px;height:54px;border-radius:50%;
  border:2.5px solid var(--ink);background:var(--paper);color:var(--ink);box-shadow:3px 4px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;
  transition:transform .28s cubic-bezier(.34,1.56,.64,1),opacity .2s,background .12s,color .12s}
#scope svg{width:32px;height:32px}
#scope.on{background:var(--ink);color:var(--paper)}
#scope:active{transform:scale(1.12,.86)}
#scope:disabled{opacity:.3;cursor:default}
#scope.pop{animation:scopePop .45s ease-out}
#scope:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
@keyframes scopePop{0%{transform:scale(1)}30%{transform:scale(.8,1.22) rotate(-8deg)}60%{transform:scale(1.12,.9) rotate(4deg)}100%{transform:scale(1)}}
#lookhint{position:fixed;left:0;right:0;z-index:4;text-align:center;pointer-events:none;bottom:calc(env(safe-area-inset-bottom,0px) + 104px);font-size:14px;font-weight:700;padding:0 12px}
#lookhint[hidden]{display:none}
#lookhint span{background:var(--ink);color:var(--paper);border-radius:999px;padding:7px 14px;display:inline-block}
#coach{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 108px);z-index:6;max-width:440px;margin:0 auto;background:var(--paper);border:2.5px solid var(--ink);border-radius:18px;
  box-shadow:4px 5px 0 var(--ink);padding:10px 14px 8px;text-align:left}
#coach[hidden]{display:none}
#coach.pop{animation:coachPop .5s cubic-bezier(.3,.7,.3,1)}
@keyframes coachPop{0%{transform:scale(.6,1.3);opacity:0}55%{transform:scale(1.05,.94);opacity:1}78%{transform:scale(.98,1.02)}100%{transform:none}}
#coach small{font-size:11px;font-weight:800;color:var(--soft)}
#coach p{margin:2px 0 4px;font-size:14px;font-weight:700;line-height:1.35}
#coach .linkbtn{font-size:12px;padding:0}
.coach-hl{animation:hl 1.3s ease-in-out infinite;border-radius:14px}
#clubs.coach-hl{border-radius:14px}
@keyframes hl{0%,100%{box-shadow:0 0 0 0 rgba(0,0,0,.0),0 0 0 3px var(--ink)}50%{box-shadow:0 0 0 7px rgba(0,0,0,.12),0 0 0 3px var(--ink)}}
.event.tut{background:var(--paper);border-width:3px}
#hint{position:fixed;left:0;right:0;z-index:4;text-align:center;pointer-events:none;
  bottom:calc(env(safe-area-inset-bottom,0px) + 104px);font-size:14px;font-weight:700;transition:opacity .5s}
#hint span{background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:7px 14px;display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

#title{position:fixed;inset:0;z-index:6;display:grid;place-items:end center;pointer-events:none;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 200px)}

@keyframes call{
  0%{opacity:0;transform:scale(.2,.2)}
  8%{opacity:1;transform:scale(1.28,.78)}
  15%{transform:scale(.88,1.16)}
  22%{transform:scale(1.05,.96)}
  29%{transform:scale(1)}
  78%{opacity:1;transform:translateY(0) scale(1)}
  84%{transform:translateY(6px) scale(1.1,.9)}

/* Terrain is a real heightfield (yards). Designed hills keep their spots; off-green mounds are
   built taller so they genuinely kick and steer the ball. Each hole also gets gentle rolling ground. */
function pathPoint(pts,t){ let L=0; const seg=[]; for(let i=0;i<pts.length-1;i++){ const l=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]); seg.push(l); L+=l; }
  let d=t*L; for(let i=0;i<seg.length;i++){ if(d<=seg[i]||i===seg.length-1){ const u=seg[i]?Math.min(1,d/seg[i]):0, a=pts[i],b=pts[i+1]; return [a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u,(b[0]-a[0])/(seg[i]||1),(b[1]-a[1])/(seg[i]||1),L]; } d-=seg[i]; } return [pts[0][0],pts[0][1],0,-1,L]; }

  const f=h.fair.find(s=>s.t==='c'), route=[h.tee,...(f&&h.par>3?f.pts:[]),h.cup], rnd=seeded(1000+ci*97+hi*13), L=pathPoint(route,0)[4], n=Math.max(2,Math.round(L/65));
  const g0=h.green[0];
  for(let i=0;i<n;i++){

    if(Math.hypot(x-g0.x,y-g0.y)<rad+24||Math.hypot(x-h.tee[0],y-h.tee[1])<rad+10) continue;
    h.terr.push({x,y,rx:rad*(.8+rnd()*.5),ry:rad*(.8+rnd()*.5),rot:rnd()*Math.PI,h:(rnd()<.55?1:-1)*(1+rnd()*2.2)});

}));

function inAny(list,x,y){ for(const s of list) if(inShape(s,x,y)) return true; return false; }
function surfaceAt(h,x,y){
  if(Math.abs(x-h.tee[0])<=5&&Math.abs(y-h.tee[1])<=3) return 'tee';
  if(inAny(h.ob,x,y)) return 'ob';
  if(inAny(h.sand,x,y)) return 'sand';
  if(inAny(h.green,x,y)) return 'green';
  if(inAny(h.fringe,x,y)) return 'fringe';
  if(inAny(h.water,x,y)) return 'water';
  if(inAny(h.fair,x,y)) return 'fairway';
  return 'rough';
}
function terrAt(h,x,y){ // returns [height, dz/dx, dz/dy]
  let z=0,gx=0,gy=0;
  for(const k of h.terr){ const dx=x-k.x,dy=y-k.y; const RR=Math.max(k.rx,k.ry)*3.2; if(Math.abs(dx)>RR||Math.abs(dy)>RR) continue;
    const c=Math.cos(k.rot),sn=Math.sin(k.rot),u=dx*c+dy*sn,v=-dx*sn+dy*c,q=u*u/(k.rx*k.rx)+v*v/(k.ry*k.ry); if(q>10) continue;
    const e=k.h*Math.exp(-q), du=-2*u/(k.rx*k.rx)*e, dv=-2*v/(k.ry*k.ry)*e;
    z+=e; gx+=du*c-dv*sn; gy+=du*sn+dv*c; }
  return [z,gx,gy];
}
const zgAt=(h,x,y)=>terrAt(h,x,y)[0];
// Rolling acceleration: gravity down the slope, plus the green's overall tilt.
function slopeAt(h,x,y,lie){
  const t=terrAt(h,x,y); let ax=-G*t[1], ay=-G*t[2];
  if(lie==='green'){ ax+=h.slope[0]; ay+=h.slope[1]; }
  return [ax,ay];
}
// Lie: how the ground tilts under the ball relative to the aim line.
function lieSlope(h,x,y,ang){ const t=terrAt(h,x,y), dx=Math.cos(ang), dy=Math.sin(ang); return {up:t[1]*dx+t[2]*dy, side:t[1]*(-dy)+t[2]*dx}; }
const slopeCarry=up=>Math.max(.8,Math.min(1.12,1-.9*up));
const slopeCurve=side=>Math.max(-.7,Math.min(.7,-side*2.5));
function lieName(L){ if(Math.abs(L.up)>=Math.abs(L.side)&&Math.abs(L.up)>.05) return L.up>0?'uphill lie':'downhill lie';
  if(Math.abs(L.side)>.05) return `sidehill lie, curves ${L.side>0?'left':'right'}`; return ''; }

function tile(w,h,draw){
  const c=document.createElement('canvas'); c.width=Math.round(w*DPR); c.height=Math.round(h*DPR);
  const g=c.getContext('2d'); g.scale(DPR,DPR); g.fillStyle='#fff'; g.fillRect(0,0,w,h);
  g.strokeStyle='#000'; g.fillStyle='#000'; g.lineCap='round'; g.lineJoin='round'; draw(g);
  return ctx.createPattern(c,'repeat');
}
function seeded(s){ return ()=>{ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }
function makePatterns(){
  patRough=tile(120,120,g=>{ const r=seeded(11); g.lineWidth=1.1; g.globalAlpha=.4;
    for(let i=0;i<9;i++){ const x=8+r()*104,y=8+r()*104,s=2+r()*1.2; g.beginPath(); g.moveTo(x-s,y+s*.7); g.lineTo(x-s*.2,y-s); g.moveTo(x+s*.2,y-s*.9); g.lineTo(x+s,y+s*.7); g.stroke(); } });
  patSand=tile(18,18,g=>{ const r=seeded(5); g.globalAlpha=.7; for(let i=0;i<4;i++){ g.beginPath(); g.arc(2+r()*14,2+r()*14,.85,0,TAU); g.fill(); } });
  patStripe=tile(36,8,g=>{ g.fillStyle='rgba(0,0,0,.035)'; g.fillRect(0,0,18,8); });
  patGreen=tile(12,12,g=>{ g.fillStyle='rgba(0,0,0,.03)'; g.fillRect(0,0,6,6); g.fillRect(6,6,6,6); });
  patShade=tile(8,8,g=>{ g.lineWidth=1; g.globalAlpha=.55; g.beginPath(); g.moveTo(-1,-1); g.lineTo(9,9); g.moveTo(-1,7); g.lineTo(1,9); g.moveTo(7,-1); g.lineTo(9,1); g.stroke(); });
  patHatch=tile(10,10,g=>{ g.lineWidth=1; g.globalAlpha=.4; g.beginPath(); g.moveTo(-2,12); g.lineTo(12,-2); g.moveTo(-2,2); g.lineTo(2,-2); g.moveTo(8,12); g.lineTo(12,8); g.stroke(); });
  patWater=tile(34,12,g=>{ g.lineWidth=1.3; g.globalAlpha=.8; g.beginPath(); for(let x=0;x<=34;x++){ const y=6+Math.sin(x/34*TAU)*2.2; x?g.lineTo(x,y):g.moveTo(x,y);} g.stroke(); });
}

}catch(e){ NET.err='Could not reach Supabase: '+(e&&e.message||e); console.warn('Online play unavailable',e); } })();

async function loadFriends(ev){
  if(ev&&ev.id==='tutorial'){ S.friends=[]; return; }
  S.friends=[]; await NET.ready;
  if(NET.sb){ try{
      const {data,error}=await NET.sb.from('rounds').select('player_id,name,tot,holes').eq('event',ev.id).eq('grp',meta.grp||'').neq('player_id',NET.uid).order('tot',{ascending:true}).limit(6);
      if(error) throw error;
      NET.load=`Found ${(data||[]).length} other player${(data||[]).length===1?'':'s'} in ${meta.grp?'group '+meta.grp:'the open group'} for this event.`;
      const out=(data||[]).filter(r=>Array.isArray(r.holes)&&r.holes.length).map(r=>({id:r.player_id,name:String(r.name||'Player').slice(0,16),tot:r.tot,holes:r.holes}));
      if(EV===ev){ S.friends=out; if(!$('card').hidden&&S.state==='card'&&document.querySelector('.board')) document.querySelector('.board').outerHTML=boardHTML(); }
    }catch(e){ S.friends=[]; NET.load='Could not load friends: '+(e.message||e.code||e); } return; }
  const db=NET.db; if(!db) return;
  try{
    const snap=await db.collection('rounds').get();
    const chosen={}; snap.docs.forEach(d=>{ const v=d.data(); if(v&&typeof v.name==='string') chosen[d.id]=v.name.slice(0,16); });
    const ids=snap.docs.filter(d=>d.id!==NET.uid&&d.data()?.events?.[ev.id]).map(d=>d.id).slice(0,6);
    const out=[];
    for(const id of ids){ const d=await db.doc(`rounds/${id}/events/${ev.id}`).get(); if(d.exists&&Array.isArray(d.data().holes)) out.push({id,holes:d.data().holes,tot:d.data().tot}); }
    let names={}; if(NET.user&&out.length){ try{ names=await NET.user.profiles(out.map(f=>f.id)); }catch(e){} }
    out.forEach(f=>{ f.name=chosen[f.id]||((names[f.id]&&names[f.id].name)||'Friend').split(' ')[0]||'Friend'; });
    if(EV===ev){ S.friends=out; if(!$('card').hidden&&S.state==='card'&&document.querySelector('.board')){ const b=document.querySelector('.board'); b.outerHTML=boardHTML(); } }
  }catch(e){ S.friends=[]; }
}

async function saveRound(){

      const curDone=S.myRemote?S.myRemote.complete:!!cur;

      const {error}=await NET.sb.from('rounds').upsert({player_id:NET.uid,event:EV.id,grp:meta.grp||'',name:meta.name||'',tot,tp,holes,updated_at:new Date().toISOString()},{onConflict:'player_id,event'});

  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d+.02); }

  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain(); s.buffer=buf; f.type='bandpass'; f.frequency.value=fc; f.Q.value=q||1; g.gain.value=v;

  if(k==='hit'){ noise(.07,.35+.4*p,3200,.7); tone(210,.09,'triangle',.3,80); }
  else if(k==='putt'){ tone(1250,.05,'sine',.16,900); }
  else if(k==='bounce'){ tone(170,.06,'sine',Math.min(.2,.04+p*.01),90); }
  else if(k==='sand'){ noise(.22,.25,1400,.6); }
  else if(k==='splash'){ noise(.55,.5,700,.5); tone(300,.25,'sine',.1,120); }
  else if(k==='tree'){ noise(.25,.3,3800,.5); }
  else if(k==='cup'){ tone(340,.06,'triangle',.25,200); setTimeout(()=>{tone(660,.15,'sine',.22); setTimeout(()=>tone(990,.35,'sine',.2),110);},90); }

function aimAngle(){ const b=S.ball,h=H(); return Math.atan2(h.cup[1]-b.y,h.cup[0]-b.x); }
function reachFor(c,lie){ return c.putter? Math.max(5,Math.min(30,distToCup()*1.25)) : CS(c).carry*lieFactor(c,lie)*MOD.carry; }
function aimFrame(ang){
  const b=S.ball,h=H(),c=CLUBS[S.club],lie=lieNow(),r=reachFor(c,lie);
  const pts=[[b.x,b.y],[b.x+Math.cos(ang)*r,b.y+Math.sin(ang)*r]];

const solveCache=new Map();

function shoot(ang,power,curve=0,quality='good'){

function physStep(dt){
  const b=S.ball,h=H();
  if(b.mode==='air'){
    flightStep(b,{x:S.wind.x*MOD.wind,y:S.wind.y*MOD.wind},dt);
    const T=terrAt(h,b.x,b.y), hz=b.z-T[0], pz=hz-b.vz*dt;
    // trees
    let inAny=-1;
    for(let i=0;i<h.trees.length;i++){ const tr=h.trees[i],dx=b.x-tr[0],dy=b.y-tr[1],d=Math.hypot(dx,dy),th=tr[2]*1.8;
      if(d<tr[2]&&hz<th&&hz>0){ inAny=i; if(b.inTree!==i){ b.inTree=i;
          if(pz>=th){ b.vx*=.2; b.vy*=.2; b.vz=Math.min(b.vz,0)*.3; }
          else{ const nx=dx/(d||1),ny=dy/(d||1),vn=b.vx*nx+b.vy*ny; if(vn<0){ b.vx-=2*vn*nx; b.vy-=2*vn*ny; } b.vx*=.35; b.vy*=.35; b.vz*=.4; }
          if(S.shot) S.shot.treeHit=true; sfx('tree'); for(let k=0;k<8;k++) burst(b.x,b.y,Math.random()*TAU,'rough'); } } }
    if(inAny<0) b.inTree=-1;
    if(b.trail.length<600) b.trail.push([b.x,b.y,Math.max(0,hz)]); recPoint();
    if(hz<=0&&b.vz-(T[1]*b.vx+T[2]*b.vy)<0) land(T);
  } else if(b.mode==='roll'){
    const lie=surfaceAt(h,b.x,b.y);
    if(lie==='water'||lie==='ob'){ penalty(lie); return; }
    const sl=slopeAt(h,b.x,b.y,lie); b.vx+=sl[0]*dt; b.vy+=sl[1]*dt;
    const dx=h.cup[0]-b.x,dy=h.cup[1]-b.y,dc=Math.hypot(dx,dy);
    let sp=Math.hypot(b.vx,b.vy);
    if(dc<.55*MOD.cupR&&sp<3){ b.vx+=dx/dc*2.2*dt; b.vy+=dy/dc*2.2*dt; }
    if(MOD.magnet&&dc<2&&dc>.05&&sp<5){ b.vx+=dx/dc*3.2*dt; b.vy+=dy/dc*3.2*dt; }
    const ns=Math.max(0,sp-rollDecel(lie,sp,b.rollMul)*dt);
    if(lie==='rough'&&sp>1.2){ if(Math.random()<dt*7) burst(b.x,b.y,Math.random()*TAU,'rough'); S.sq+=(Math.random()-.5)*.06; } if(sp>0){ b.vx*=ns/sp; b.vy*=ns/sp; }
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.z=zgAt(h,b.x,b.y); recPoint();
    const d2=Math.hypot(h.cup[0]-b.x,h.cup[1]-b.y);
    if(d2<.3*MOD.cupR){
      if(ns<2.6+MOD.cupV+(S.shot&&S.shot.isPutt?CS(CLUBS[PUTTER]).capV:0)){ sink(); return; }
      if(!b.lipped){ b.lipped=true; const r=(Math.random()<.5?-1:1)*(.4+Math.random()*.5),c=Math.cos(r),s=Math.sin(r);
        const vx=b.vx*c-b.vy*s, vy=b.vx*s+b.vy*c; b.vx=vx*.65; b.vy=vy*.65; tone(520,.05,'sine',.12); }
    } else b.lipped=false;
    if(ns<.12&&Math.hypot(sl[0],sl[1])<rollOf(lie)*.55){ b.vx=b.vy=0; b.mode='rest'; }
  }
}
function bounceApply(b,lie,first,g){
  const s=SURF[lie]; let e=s.e, f=s.f; g=g||[0,0];
  if(MOD.bouncy&&lie!=='sand'){ e=Math.min(.7,e*1.8); f=Math.min(.85,f*1.25); }
  if(first) f*=(1-(b.check||0)); f=Math.max(0,Math.min(.95,f));
  const nl=Math.hypot(g[0],g[1],1), nx=-g[0]/nl, ny=-g[1]/nl, nz=1/nl, vn=b.vx*nx+b.vy*ny+b.vz*nz;
  let tx=(b.vx-vn*nx)*f, ty=(b.vy-vn*ny)*f, tz=(b.vz-vn*nz)*f, rev=false;
  if(first&&b.back>0&&(lie==='green'||lie==='fairway'||lie==='tee')){ const th=Math.hypot(tx,ty)||1e-6, nh=th-b.back*(lie==='green'?1:.6); tx=tx/th*nh; ty=ty/th*nh; rev=nh<0; }
  const out=-vn*e;
  b.vx=tx+out*nx; b.vy=ty+out*ny; b.vz=tz+out*nz;
  if(out<1.4||lie==='sand'){ b.vz=0; b.mode='roll'; }

}
function land(T){
  const b=S.ball,h=H(); T=T||terrAt(h,b.x,b.y); b.z=T[0]; const lie=surfaceAt(h,b.x,b.y), impact=Math.max(0,-(b.vz-(T[1]*b.vx+T[2]*b.vy)));
  if(lie==='water'||lie==='ob'){ penalty(lie); return; }
  if(Math.hypot(h.cup[0]-b.x,h.cup[1]-b.y)<.35*MOD.cupR&&Math.hypot(b.vx,b.vy)<30){ sink(); return; }
  const first=b.bounces===0;

  const rev=bounceApply(b,lie,first,[T[1],T[2]]); b.bounces++; b.z=T[0]+.001;
  if(rev&&S.shot){ S.shot.spunBack=true; parts.push({k:'ring',x:b.x,y:b.y,t:0,life:.5,r:.8,thin:true}); tone(700,.12,'sine',.08,420); }

  if(lie==='sand'){ sfx('sand'); for(let i=0;i<14;i++) burst(b.x,b.y,Math.random()*TAU,'sand'); }
  else { sfx('bounce',impact); if(impact>6) parts.push({k:'ring',x:b.x,y:b.y,t:0,life:.45,r:1.2,thin:true});
    if(lie==='rough') for(let i=0;i<5;i++) burst(b.x,b.y,Math.random()*TAU,'rough'); }

}

let drag=null;
const maxDrag=()=>Math.min(W,Hh)*.42;
function dragInfo(){

// Bend a shot by bowing the drag: bulge to the right of your pull and the ball curves right.
function dragCurve(){
  const p=drag.path, dx=drag.x-drag.x0, dy=drag.y-drag.y0, l=Math.hypot(dx,dy); if(l<30||p.length<3) return 0;
  const ax=-dx/l, ay=-dy/l, rx=-ay, ry=ax; let best=0;
  for(const q of p){ const qx=q[0]-drag.x0, qy=q[1]-drag.y0, t=(qx*dx+qy*dy)/(l*l); if(t<.05||t>.98) continue;
    const v=((qx-dx*t)*rx+(qy-dy*t)*ry)/l; if(Math.abs(v)>Math.abs(best)) best=v; }

      ctx.globalAlpha=u>.78?(1-u)/.22:1; ctx.save(); ctx.translate(x,y-30-p.off-u*30); ctx.scale(sc,sy);
      ctx.textAlign='center'; ctx.textBaseline='middle';
      if(p.big){ ctx.font='italic 900 19px Fraunces, Georgia, serif'; const w=ctx.measureText(p.text).width+22;
        ctx.beginPath(); ctx.roundRect?ctx.roundRect(-w/2,-15,w,30,15):ctx.rect(-w/2,-15,w,30); ctx.fillStyle='#000'; ctx.fill();
        ctx.fillStyle='#fff'; ctx.fillText(p.text,0,1); }
      else { ctx.font='800 14px Figtree, system-ui, sans-serif'; ctx.lineWidth=4.5; ctx.strokeStyle='#fff'; ctx.lineJoin='round'; ctx.strokeText(p.text,0,0); ctx.fillStyle='#000'; ctx.fillText(p.text,0,0); }
      ctx.restore(); }
    else if(p.k==='streak'){ const e=1-Math.pow(1-u,3), d0=8+e*p.len, d1=d0+p.len*(1-u); ctx.globalAlpha=1-u; ctx.lineWidth=2; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(p.sx+Math.cos(p.ang)*d0,p.sy+Math.sin(p.ang)*d0); ctx.lineTo(p.sx+Math.cos(p.ang)*d1,p.sy+Math.sin(p.ang)*d1); ctx.stroke(); }
    ctx.globalAlpha=1; }
}
function draw(t,dt){
  const h=H();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const [ox,oy]=WS(0,0);
  setPat(patRough,ox,oy); setPat(patSand,ox,oy); setPat(patWater,ox+t*7,oy); setPat(patStripe,ox,oy); setPat(patGreen,ox,oy); setPat(patHatch,ox,oy); setPat(patShade,ox,oy);
  ctx.fillStyle=patRough; ctx.fillRect(0,0,W,Hh);
  ctx.lineCap='round'; ctx.lineJoin='round';
  // every surface is inked as one merged layer: all outlines first, then all fills
  layer(h.ob,patHatch); drawStakes(h);
  layer(h.fair,patStripe);
  layer(h.water,patWater);
  ctx.strokeStyle='#000'; ctx.lineWidth=1.3; ctx.setLineDash([3,5]); h.green.forEach(g=>{ ellPath(g,1.6); ctx.stroke(); }); ctx.setLineDash([]);
  ctx.fillStyle='#fff'; h.green.forEach(g=>{ ellPath(g,1.45); ctx.fill(); });
  layer(h.green,patGreen,INK+.3);
  layer(h.sand,patSand);
  drawSlopes(h);

  // tee box
  { const [x,y]=WS(h.tee[0]-5,h.tee[1]-3); const w=10*cam.z, hh=6*cam.z; ctx.beginPath(); ctx.roundRect?ctx.roundRect(x,y,w,hh,Math.min(8,hh/2)):ctx.rect(x,y,w,hh);
    ctx.fillStyle='#fff'; ctx.fill(); ctx.lineWidth=1.6; ctx.strokeStyle='#000'; ctx.stroke();
    [-4,4].forEach(d=>{ const [mx,my]=WS(h.tee[0]+d,h.tee[1]-1.5); ctx.beginPath(); ctx.arc(mx,my,3,0,TAU); ctx.fillStyle='#000'; ctx.fill(); }); }
  drawParts(dt,true);
  if(S.state==='aim') drawAim(t);
  drawTrail();
  const b=S.ball;
  let under=false; { const bz=b.z-zgAt(h,b.x,b.y); for(const tr of h.trees){ if(Math.hypot(b.x-tr[0],b.y-tr[1])<tr[2]&&bz<tr[2]*1.8){ under=true; break; } } }
  if(under) drawBall();
  drawFlag(t);
  h.trees.forEach((tr,i)=>drawTree(tr,i,t));
  if(!under) drawBall();
  drawGhosts();
  if(MOD.fog){ const [fx,fy]=WS(b.x,b.y), g=ctx.createRadialGradient(fx,fy,60*cam.z,fx,fy,88*cam.z);
    g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(1,'rgba(255,255,255,1)'); ctx.fillStyle=g; ctx.fillRect(0,0,W,Hh);
    ctx.save(); ctx.globalAlpha=.14; ctx.strokeStyle='#000'; ctx.lineWidth=1.2; ctx.lineCap='round';
    for(let i=0;i<14;i++){ const yy=((i*97+t*6)%(Hh+40))-20, xx=((i*211)%W)-60+Math.sin(t*.3+i)*20, rr=Math.hypot(xx+60-fx,yy-fy); if(rr<70*cam.z) continue;
      ctx.beginPath(); ctx.moveTo(xx,yy); ctx.bezierCurveTo(xx+30,yy-5,xx+60,yy+5,xx+110,yy); ctx.stroke(); }
    ctx.restore(); }
  drawParts(dt,false);
}

/* ============================================================
   LOOP
   ============================================================ */
let lastT=performance.now(), acc=0;
const ease=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000); lastT=now; S.t+=dt; const t=S.t;
  // physics
  const b=S.ball;
  // slow motion when a ball is tracking into the cup
  { let tg=1; const h=H(), dx=h.cup[0]-b.x, dy=h.cup[1]-b.y, d=Math.hypot(dx,dy), sp=Math.hypot(b.vx,b.vy);
    if(S.state==='flight'&&b.mode==='roll'&&d<1.8&&d>.02&&sp>.25&&sp<6&&(b.vx*dx+b.vy*dy)/(sp*d)>.88) tg=.28;
    if(S.state==='flight'&&b.mode==='air'&&b.vz<0&&b.z-zgAt(h,b.x,b.y)<4&&d<2.5) tg=.28;
    S.slow+=(tg-S.slow)*(1-Math.exp(-dt*(tg<S.slow?12:4)));
    if(tg<1&&!S.slowOn){ S.slowOn=true; tone(80,.5,'sine',.2,55); } else if(tg===1) S.slowOn=false;
    if(S.slow<.8&&S.state==='flight'){ camT.x=(b.x+h.cup[0])/2; camT.y=(b.y+h.cup[1])/2; camT.z=Math.min(30,Math.max(camT.z,cam.z*1.02,12)); } }
  if(S.hitStop>0){ S.hitStop-=dt; }
  else if(S.state==='flight'||S.state==='sunk'){ acc+=dt*TS*S.slow; while(acc>=DT){ physStep(DT); acc-=DT; if(S.state!=='flight') break; } } else acc=0;
  if(S.state==='flight'&&b.mode==='rest'){ if(S.restT===0){ awardShot('rest'); recEnd('rest'); saveRun('aim'); } S.restT+=dt; if(S.restT>.55){ if(S.strokes>=10||!startGhosts()) toAim(); } }
  if(S.state==='ghost'){ S.timer+=dt; if(updateGhosts(dt)){ S.ghostHold=(S.ghostHold||0)+dt; if(S.ghostHold>.7){ S.ghostHold=0; toAim(); } } }
  if(S.state==='water'){ S.timer+=dt; if(S.timer>1.5){ Object.assign(b,{x:S.last.x,y:S.last.y,z:0,vx:0,vy:0,vz:0,mode:'rest',trail:[]}); S.sq=.5; toAim(); } }
  if(S.state==='sunk'){ S.sinkT+=dt; S.timer+=dt; if(S.timer>1.1&&!S.banked) bankHole(S.strokes); if(S.timer>2.6) finishHole(S.strokes); }
  // squash & flag springs (follow-through)
  S.sqv+=(-190*S.sq-11*S.sqv)*dt; S.sq+=S.sqv*dt;
  S.fpv+=(-160*S.fp-7*S.fpv)*dt; S.fp+=S.fpv*dt;
  // camera: intro staging, then a slightly underdamped spring
  if(S.state==='intro'){ const I=S.intro; I.t+=dt; const u=ease(Math.max(0,Math.min(1,(I.t-1.4)/2.2)));
    cam.x=I.from.x+(I.to.x-I.from.x)*u; cam.y=I.from.y+(I.to.y-I.from.y)*u; cam.z=Math.exp(Math.log(I.from.z)+(Math.log(I.to.z)-Math.log(I.from.z))*u);
    if(I.t>4.2) endIntro(); }
  else {
    if(S.state==='flight'&&b.mode!=='rest'&&S.slow>=.8){ camT.x=b.x+b.vx*.3; camT.y=b.y+b.vy*.3; }
    if(S.state==='sunk'){ const h=H(); camT.x=h.cup[0]; camT.y=h.cup[1]-1.5; camT.z=Math.max(camT.z,8); }
    const k=24,c=8.2; cam.vx+=(k*(camT.x-cam.x)-c*cam.vx)*dt; cam.vy+=(k*(camT.y-cam.y)-c*cam.vy)*dt;
    cam.x+=cam.vx*dt; cam.y+=cam.vy*dt; cam.z*=Math.exp((Math.log(camT.z)-Math.log(cam.z))*(1-Math.exp(-dt*3)));
  }
  S.shake*=Math.exp(-dt*9); const sk=S.shake*(RM?.15:1); shakeOff.x=(Math.random()-.5)*sk; shakeOff.y=(Math.random()-.5)*sk;
  if(S.state==='flight'&&((t*10)|0)%3===0) updHUD();
  { const tgt=S.points+S.holePts; if(Math.abs(tgt-S.disp)>.5){ S.disp+=(tgt-S.disp)*(1-Math.exp(-dt*5)); if(Math.abs(tgt-S.disp)<1) S.disp=tgt; $('pv').textContent=Math.round(S.disp).toLocaleString(); } }
  draw(t,dt);
  requestAnimationFrame(frame);
}

/* boot */
addEventListener('resize',()=>{ resize(); if(S.state==='aim') frameAim(); });
resize();
EV=null;
S.field=RIVALS.map(r=>({...r,scores:[]}));
computeMod();
updHUD();
{ const RUN=meta.name?loadRun():null; if(!(RUN&&resumeRun(RUN))){ EV=EVENTS[0]; showHome(); } }
requestAnimationFrame(frame);
})();
</script>
