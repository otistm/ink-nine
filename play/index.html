<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ink Nine</title>
<meta name="description" content="Play golf. Do well. Get trophies.">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ink Nine">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Ink Nine">
<meta property="og:title" content="Ink Nine">
<meta property="og:description" content="Play golf. Do well. Get trophies.">
<meta property="og:url" content="https://www.inknine.golf/play/">
<link rel="canonical" href="https://www.inknine.golf/play/">
<meta property="og:image" content="https://www.inknine.golf/og-image.png">
<meta property="og:image:alt" content="Ink Nine: an ink-drawn golf hole beside the words Play golf. Do well. Get trophies.">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Ink Nine">
<meta name="twitter:description" content="Play golf. Do well. Get trophies.">
<meta name="twitter:image" content="https://www.inknine.golf/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,800;1,9..144,900&family=Figtree:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="c" aria-label="Golf course"></canvas>

<header id="top">
  <div>
    <div class="hn" id="hn">Hole 1</div>
    <div class="sub" id="hsub">Par 4</div>
    <div class="sub" id="dist"></div>
  </div>
  <div class="right">
  <div class="pts" aria-live="polite"><div class="pv" id="pv">0</div><div class="sub" id="streak">No streak</div></div>
  </div>
</header>

<div id="strikeWrap">
  <div id="dial" hidden>
    <div class="dlab top">Knockdown<br><small>low, topspin</small></div>
    <svg id="dialSvg" viewBox="0 0 150 150" aria-label="Strike point: drag up or down">
      <circle cx="75" cy="75" r="62" fill="#fff" stroke="#000" stroke-width="2.5"/>
      <g stroke="#000" stroke-width="1.2" opacity=".25" fill="none"><circle cx="55" cy="55" r="5"/><circle cx="95" cy="55" r="5"/><circle cx="75" cy="40" r="5"/><circle cx="50" cy="95" r="5"/><circle cx="100" cy="95" r="5"/><circle cx="75" cy="110" r="5"/><circle cx="75" cy="75" r="5"/><circle cx="40" cy="75" r="5"/><circle cx="110" cy="75" r="5"/></g>
      <line x1="75" y1="17" x2="75" y2="133" stroke="#000" stroke-width="1.5" stroke-dasharray="3 5" opacity=".5"/>
      <line x1="60" y1="75" x2="90" y2="75" stroke="#000" stroke-width="1.5" opacity=".5"/>
      <g id="dialDot"><circle cx="75" cy="75" r="11" fill="#000"/><circle cx="75" cy="75" r="4" fill="#fff"/></g>
    </svg>
    <div class="dlab bot">Flop<br><small>high, backspin</small></div>
    <div class="dname" id="dname">Stock</div>
  </div>
  <button id="strike" type="button" aria-label="Strike point" aria-expanded="false">
    <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="15" fill="none" stroke="currentColor" stroke-width="2.2"/><line x1="20" y1="7" x2="20" y2="33" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3" opacity=".5"/><circle id="miniDot" cx="20" cy="20" r="4.2" fill="currentColor"/></svg>
  </button>
</div>
<div id="windWrap">
  <div id="windBox" hidden role="dialog" aria-label="Wind"><button type="button" class="wx" id="windX" aria-label="Close">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5L15 15M15 5L5 15" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button><div id="windInfo"></div></div>
  <button id="windBtn" type="button" aria-label="Wind" aria-expanded="false">
    <svg viewBox="0 0 42 42" aria-hidden="true"><g id="warrow" style="transform-origin:21px 21px"><path d="M21 8 L28 19 L23.5 19 L23.5 33 L18.5 33 L18.5 19 L14 19 Z" fill="currentColor"/></g></svg>
  </button>
  <span id="wmph">0 mph</span>
</div>
<button id="scope" type="button" aria-label="Look around the hole" aria-pressed="false">
  <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M6 13.5 L21.5 9 L23.2 15 L7.6 19.2 Z" fill="currentColor" fill-opacity=".12"/>
    <path d="M21.5 7.6 L25.8 6.4 L28 14.6 L23.7 15.8 Z"/>
    <path d="M2.8 15 L6 14.1 L7.3 18.6 L4.1 19.5 Z"/>
    <path d="M15.2 17 L10.5 28.5 M15.2 17 L20 28.5 M15.2 17 L15.2 28.5"/>
  </svg>
</button>
<button id="pause" type="button" aria-label="Pause">
  <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="9" y="8" width="5" height="16" rx="1.5" fill="currentColor"/><rect x="18" y="8" width="5" height="16" rx="1.5" fill="currentColor"/></svg>
</button>
<div id="lookhint" hidden><span>Drag to look around, pinch to zoom</span></div>
<div id="coach" hidden role="status" aria-live="polite"><small id="coachN"></small><p id="coachT"></p><button class="linkbtn" id="coachSkip">Skip tutorial</button><div class="cbar" aria-hidden="true"><i id="coachBar"></i></div></div>
<div id="hint"><span>Pick a club, then drag back and let go</span></div>

<nav id="bar" aria-label="Clubs">
  <div id="shot"></div>
  <div id="clubs"></div>
</nav>

<div id="title"><div class="tc"><div class="tn" id="tn">Hole 1</div><div class="tname" id="tname"></div><div class="tp" id="tp">Par 4</div><div class="tl" id="tl"></div><div class="ttip" id="ttip"></div></div></div>
<div id="callout"></div>
<div id="card" hidden><div class="panel" id="panel"></div></div>
<script src="js/config.js"></script>
<script src="js/engine.js"></script>
<script src="js/courses.js"></script>
<script src="js/run.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/online.js"></script>
<script src="js/screens.js"></script>
<script src="js/rounds.js"></script>
<script src="js/audio.js"></script>
<script src="js/flow.js"></script>
<script src="js/points.js"></script>
<script src="js/physics.js"></script>
<script src="js/input.js"></script>
<script src="js/draw.js"></script>
<script src="js/main.js"></script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('/sw.js').catch(()=>{});</script>
</body>
</html>
